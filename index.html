<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C4C3A">
<title>Panolyzer Management · C2TECH</title>
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preload" as="image" href="img/logo-512.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261101b">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="เมนูหลัก">
    <div class="logo"><img id="logoW" src="img/c2tech-white.png" alt="C2TECH"><small>Panolyzer Management</small></div>
    <button class="nav" data-go="dash"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></button>
    <button class="nav" data-go="machines"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span data-t="nav.machines"></span><span class="ct num" id="ctM"></span></button>
    <button class="nav" data-go="trials"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg><span data-t="nav.trials"></span><span class="ct num" id="ctT"></span></button>
    <div class="grow"></div>
    <div class="foot">
      <div class="sync" style="color:#B9CDBF" id="syncR"></div>
      <button data-act="refresh"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span data-t="refresh"></span></button>
      <button data-act="admin" id="adminR"></button>
      <div class="seg"><button data-lang="th">TH</button><button data-lang="en">EN</button></div>
    </div>
  </aside>

  <div class="main">
    <div class="mtop"><img id="logoM" src="img/c2tech-white.png" alt="C2TECH"><h1 id="ttlM"></h1>
      <button data-act="refresh" aria-label="รีเฟรช"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
      <button data-act="lang" id="langM">EN</button>
      <button data-act="admin" id="adminM" aria-label="Admin"></button>
    </div>
    <header class="top"><h1 id="ttl"></h1><span class="sp"></span><span class="sync" id="sync"></span>
      <div class="seg" role="group" aria-label="ธีม"><button data-theme-set="light">☀</button><button data-theme-set="auto">A</button><button data-theme-set="dark">☾</button></div>
    </header>
    <div class="adminbar" id="adminbar" hidden></div>
    <main class="page" id="page"></main>
  </div>
</div>

<nav class="bnav" aria-label="เมนูหลัก">
  <button data-go="dash"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></button>
  <button data-go="machines"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg><span data-t="nav.machines"></span></button>
  <button data-go="trials"><svg class="ms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg><span data-t="nav.trials"></span></button>
</nav>

<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="รายละเอียดเครื่อง"></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" role="status"></div>

<div class="ld" id="ld" role="status" aria-live="polite">
  <div class="lens"><div class="ring"></div><div class="orb"><i></i><i></i><i></i></div><div class="grains"><b></b><b></b><b></b></div>
    <div class="disc"><img id="ldImg" src="img/logo-512.webp" alt="Panolyzer" width="188" height="188"><div class="beam"></div></div></div>
  <div class="lt"><b>Panolyzer Management</b><small>by C2TECH</small></div>
  <div class="bar"><i></i></div>
  <div class="step" id="ldStep">กำลังเชื่อมต่อ…</div>
  <button class="btn pri" id="ldErr" data-act="retry" hidden>ลองใหม่</button>
</div>
<script src="script.js?v=20261101b"></script>
</body>
</html>
