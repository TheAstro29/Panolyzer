<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3F654D">
    <title>Panolyzer Management by C2TECH</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-minimal/minimal.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Loading screen -->
    <div id="app-loader">
        <div class="loader-container">
            <div class="logo-wrapper">
                <img src="img/logo.png" alt="Panolyzer Logo" class="chibi-logo">
                <div class="loader-ring"></div>
            </div>
            <div class="loader-text" id="loader-msg">Panolyzer Management</div>
        </div>
    </div>

    <!-- Mobile top bar: brand + language + admin access -->
    <div class="mobile-top-bar">
        <button class="menu-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i> <span id="m-menu-text">เมนู</span>
        </button>
        <div class="top-bar-actions">
            <i class="fas fa-lock admin-login-btn icon-btn" onclick="adminAuth()" title="Admin Login"></i>
            <div class="mobile-lang">
                <button class="mobile-lang-btn" id="m-btn-th" onclick="setLanguage('th')">TH</button>
                <button class="mobile-lang-btn" id="m-btn-en" onclick="setLanguage('en')">EN</button>
            </div>
            <div class="top-bar-brand">
                <div class="top-bar-title">
                    <span class="name">Panolyzer</span>
                    <span class="ver">C2TECH v0.4.0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile bottom navigation: primary views within thumb reach -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item active" id="bnav-all" onclick="switchView('all')">
                <i class="fas fa-server"></i>
                <span data-i18n="all">เครื่องทั้งหมด</span>
            </button>
            <button class="bottom-nav-item" id="bnav-rejected" onclick="switchView('rejected')">
                <i class="fas fa-history"></i>
                <span data-i18n="rejected">ประวัติทดลอง</span>
            </button>
            <button class="bottom-nav-item" id="bnav-dashboard" onclick="showDashboard()">
                <i class="fas fa-chart-pie"></i>
                <span>Dashboard</span>
            </button>
        </div>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar: brand, nav (desktop), language, stats overview, admin/refresh -->
    <div class="sidebar" id="sidebar">
        <div class="brand-container">
            <img src="img/logo.png" alt="C2TECH" class="brand-logo-img">
            <h1 class="brand-text">Panolyzer<br>Management</h1>
            <div class="brand-sub"></div>
            <div class="brand-tag">BY C2TECH</div>
        </div>

        <div class="lang-container">
            <button class="lang-btn" id="btn-th" onclick="setLanguage('th')">TH</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
        </div>

        <ul class="sidebar-menu">
            <li class="sidebar-menu-item" onclick="switchView('all')">
                <i class="fas fa-server"></i> <span data-i18n="all">เครื่องทั้งหมด</span>
            </li>
            <li class="sidebar-menu-item tone-danger" onclick="switchView('rejected')">
                <i class="fas fa-history"></i> <span data-i18n="rejected">ประวัติทดลอง</span>
            </li>
            <li class="sidebar-menu-item tone-info" onclick="showDashboard()">
                <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
            </li>
        </ul>

        <div class="nav-label" id="nav-label-ov"><i class="fas fa-chart-pie"></i> ภาพรวมระบบ</div>
        <div class="stats-grid" id="statsBox"></div>

        <div class="sidebar-footer">
            <div id="updateTime" class="sync-time"></div>
            <button onclick="adminAuth()" class="btn-block">
                <i class="fas fa-lock admin-login-btn"></i> <span id="adminBtnText">Admin Login</span>
            </button>
            <button onclick="fetchData()" id="refresh-btn" class="btn-block primary">
                <i class="fas fa-sync-alt"></i> รีเฟรชข้อมูล
            </button>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="page-header">
            <h2 id="main-title">เครื่องทั้งหมด</h2>
            <div id="totalCounter" class="total-counter"></div>
        </div>

        <div class="controls-card">
            <div class="search-row">
                <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="ค้นหา S/N, ลูกค้า, โหมด...">
                <select id="clientFilter" onchange="renderTable()">
                    <option value="all">-- ลูกค้าทั้งหมด --</option>
                </select>
                <select id="modeFilter" onchange="renderTable()">
                    <option value="all">-- Select Mode --</option>
                    <option value="Milled rice">Milled rice</option>
                    <option value="Paddy">Paddy</option>
                </select>
                <select id="resultFilter" onchange="renderTable()" style="display:none;"></select>
            </div>
            <div class="controls-footer">
                <button onclick="resetFilters()" id="reset-btn" class="reset-link">
                    <i class="fas fa-undo"></i> <span id="text-reset">ล้างค่าการค้นหา</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <div class="table-scroll">
                <table>
                    <thead id="tableHead">
                        <tr></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
